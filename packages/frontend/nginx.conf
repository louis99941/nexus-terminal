# 当上游代理（如宿主机 nginx）未传递 X-Forwarded-Proto 时，回退到当前 scheme
# 这确保 express-session 的 proxy + secure cookie 能正确检测 HTTPS
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# WebSocket 连接头映射：仅在客户端请求升级时发送 upgrade，否则使用 close
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name localhost;
    client_max_body_size 10m; # 允许最大 10MB 的请求体

    # 使用 Docker 内置 DNS 解析器进行动态上游解析
    # 防止 nginx 在上游主机暂时不可用时启动失败
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:3001;

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Serve static files directly
    location / {
        access_log off;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (JS, CSS, images, fonts)
    # Match hashed filenames (common in Vite/Webpack builds) for long-term caching
    location ~* \.(?:css|js|woff|woff2|ttf|eot|ico|svg|png|jpg|jpeg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;

        # Enable serving pre-compressed .gz files if they exist
        gzip_static on;
    }

    # 后端 API 代理（普通 HTTP 请求）
    location ^~ /api/ {
        access_log off;
        # rewrite ^/api(/.*)$ $1 break; # Remove /api prefix before proxying - REMOVED to match backend routes
        proxy_pass $backend_upstream; # Proxy to backend root, backend expects /api/v1/...

        # 标准代理头；X-Forwarded-Proto 只应来自可信外层代理。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 保留上游代理（如 Cloudflare/nginx）设置的协议头，若不存在则使用当前 scheme
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # 使用 map 变量：WebSocket 请求自动 upgrade，普通请求使用 close 避免连接池异常
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 显式超时：快速失败让前端重试逻辑生效
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # 上游失败时自动重试
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # WebSocket 代理（终端连接等长连接场景）
    location /ws/ {
        access_log off;
        proxy_pass $backend_upstream; # Assuming backend handles WS on the same port

        # WebSocket 必需头
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 标准代理头；X-Forwarded-Proto 只应来自可信外层代理。
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 保留上游代理设置的协议头，回退到当前 scheme
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # WebSocket 长连接超时
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
